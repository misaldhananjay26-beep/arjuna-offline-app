name: Build Arjuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'arjuna-offline-upgrade-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Arjuna project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p extracted
          unzip -q -o arjuna-offline-upgrade-v1.zip -d extracted

          PROJECT_DIR=$(find extracted -type d -name android-wrapper | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find android-wrapper inside the zip archive."
            find extracted -maxdepth 4 -print
            exit 1
          fi

          test -f "$PROJECT_DIR/gradlew"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Arjuna APK
        shell: bash
        env:
          ANDROID_PROJECT_DIR: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          cd "$ANDROID_PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arjuna-Android-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
