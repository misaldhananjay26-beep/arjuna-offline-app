
name: Build Arjuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'arjuna-offline-upgrade-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        
      - name: Ensure Android manifest exists
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main"

          cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="Arjuna Interactive Lab"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
