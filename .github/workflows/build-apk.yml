
name: Build Arjuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'arjuna-offline-upgrade-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q arjuna-offline-upgrade-v1.zip -d extracted
          PROJECT="$GITHUB_WORKSPACE/extracted/arjuna-offline-upgrade-v1/android-wrapper"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Kotlin dependency versions
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == 'org.jetbrains.kotlin') {
                      useVersion '1.8.22'
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arjuna-Android-APK
          path: ${{ github.workspace }}/extracted/arjuna-offline-upgrade-v1/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
name: Build Arjuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'arjuna-offline-upgrade-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Arjuna project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p extracted
          unzip -q -o arjuna-offline-upgrade-v1.zip -d extracted

          SETTINGS_PATH=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside the zip archive."
            find extracted -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android app module not found under $PROJECT_DIR."
            find "$PROJECT_DIR" -maxdepth 3 -print
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Arjuna APK
        shell: bash
        env:
          ANDROID_PROJECT_DIR: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -euxo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arjuna-Android-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
