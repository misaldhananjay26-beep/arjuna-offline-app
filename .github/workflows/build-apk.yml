
name: Build Arjuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'arjuna-offline-upgrade-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Arjuna project
        shell: bash
        run: |
          set -e
          unzip -q arjuna-offline-upgrade-v1.zip -d extracted

          PROJECT="$GITHUB_WORKSPACE/extracted/arjuna-offline-upgrade-v1/android-wrapper"

          if [ ! -f "$PROJECT/settings.gradle" ]; then
            echo "Android project settings.gradle missing"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "Android app build.gradle missing"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Create and verify Android manifest
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/app/src/main"

          cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Arjuna Interactive Lab"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/app/arjuna/MainActivity.java"

          echo "Android manifest and MainActivity verified"
          ls -la "$PROJECT_DIR/app/src/main"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Align Kotlin dependencies
        shell: bash
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == 'org.jetbrains.kotlin') {
                      useVersion '1.8.22'
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Arjuna APK
        shell: bash
        run: |
          set -e

          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      - name: Upload Arjuna APK
        uses: actions/upload-artifact@v4
        with:
          name: Arjuna-Android-APK
          path: extracted/arjuna-offline-upgrade-v1/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
