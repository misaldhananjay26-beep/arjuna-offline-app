
name: Build Arjuna Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'arjuna-offline-upgrade-v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Arjuna
        run: |
          set -e
          unzip -q arjuna-offline-upgrade-v1.zip -d extracted

          PROJECT="$GITHUB_WORKSPACE/extracted/arjuna-offline-upgrade-v1/android-wrapper"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Fix Android manifests
        shell: bash
        run: |
          set -e

          for DIR in "$PROJECT_DIR/src/main" "$PROJECT_DIR/app/src/main"; do
            mkdir -p "$DIR"

            cat > "$DIR/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="false"
                  android:label="Arjuna Interactive Lab"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          done

          echo "Both Android manifest locations created."
          find "$PROJECT_DIR" -name AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Kotlin versions
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == 'org.jetbrains.kotlin') {
                      useVersion '1.8.22'
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          echo "Project: $PROJECT_DIR"
          echo "Settings:"
          cat "$PROJECT_DIR/settings.gradle"
          echo "Root build:"
          cat "$PROJECT_DIR/build.gradle"
          echo "App build:"
          cat "$PROJECT_DIR/app/build.gradle"
          echo "Java files:"
          find "$PROJECT_DIR" -name "*.java"

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arjuna-Android-APK
          path: extracted/arjuna-offline-upgrade-v1/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
